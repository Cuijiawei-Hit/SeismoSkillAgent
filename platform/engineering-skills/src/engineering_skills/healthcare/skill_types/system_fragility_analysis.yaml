{
  "id": "system_fragility_analysis",
  "version": "1.1.0",
  "name": "系统易损性分析 Skill Type",
  "description": "根据工程需求、易损性参数和系统失效规则计算设施损伤与系统失效概率。",
  "domain": "urban_seismic_resilience",
  "task": "构件、设施和系统层级易损性与损伤评估",
  "input_semantics": [
    "工程需求样本",
    "构件易损性",
    "设施清单",
    "系统失效规则"
  ],
  "output_semantics": [
    "损伤状态概率",
    "设施失效概率",
    "系统失效概率",
    "关键设施",
    "易损性曲线"
  ],
  "invariant_rules": [
    "概率位于0到1",
    "互斥损伤状态概率和为1",
    "给定正中值和离散性的单构件条件超越概率随EDP单调"
  ],
  "applicability": [
    "建筑群",
    "基础设施网络",
    "城市功能系统"
  ],
  "non_goals": [
    "不使用LLM生成定量损伤概率"
  ],
